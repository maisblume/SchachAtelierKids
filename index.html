/* ==================== Coach: suggestions, move quality, goals ==================== */
function explainMove(game, move) {
  const reasons = [];
  const piece = game.board[move.from.r][move.from.c];
  if (!piece) return 'Das ist ein kluger Zug!';

  const snap = snapshot(game);
  game.move({ from: move.from, to: move.to, castle: move.castle, promoteTo: move.promoteTo || 'q' });
  const givesCheck = game.inCheck(game.turn);
  restore(game, snap);

  if (move.promotion) reasons.push('verwandelt deinen Bauern in eine starke Figur! 👑');
  if (move.capture) reasons.push('schnappt sich eine Figur vom Gegner! 😊');
  if (givesCheck) reasons.push('bedroht den König des Gegners!');
  if (move.castle) reasons.push('bringt deinen König in ein sicheres Schloss! 🏰');
  const homeRow = piece.color === 'w' ? 7 : 0;
  const isDeveloping = (piece.type === 'n' || piece.type === 'b') && move.from.r === homeRow;
  if (isDeveloping) reasons.push('weckt eine schlafende Figur auf');
  const centerFiles = [2, 3, 4, 5];
  const centerRanks = [3, 4, 5, 6];
  if (centerFiles.includes(move.to.c) && centerRanks.includes(move.to.r) && !isDeveloping) {
    reasons.push('erobert die Mitte des Spielfelds');
  }
  if (!reasons.length) reasons.push('ist ein kluger Zug');
  return reasons.length > 1
    ? 'Dieser Zug ' + reasons.slice(0, -1).join(', ') + ' und ' + reasons[reasons.length - 1] + '.'
    : 'Dieser Zug ' + reasons[0] + '.';
}

// Reference analysis for whoever is to move: the coach's own suggested move
// plus a score from the mover's perspective (positive = good for the mover).
function getCoachAnalysis(game) {
  const move = chooseStrongMove(game);
  if (!move) return null;
  const snap = snapshot(game);
  const moverColor = game.turn;
  game.move({ from: move.from, to: move.to, castle: move.castle, promoteTo: move.promoteTo || 'q' });
  const raw = evaluate(game);
  restore(game, snap);
  const score = moverColor === 'w' ? raw : -raw;
  return { move, score };
}
function coachMoveLabel(game, move) {
  return sqName(move.from.r, move.from.c) + '–' + sqName(move.to.r, move.to.c);
}

function suggestGoal(game) {
  const color = state.playerColor;
  const opponent = color === 'w' ? 'b' : 'w';
  const homeRow = color === 'w' ? 7 : 0;
  const moveCount = game.history.length;
  const canCastle = color === 'w' ? (game.castling.wK || game.castling.wQ) : (game.castling.bK || game.castling.bQ);
  const kingHome = game.board[homeRow][4] && game.board[homeRow][4].type === 'k';

  if (moveCount < 24 && canCastle && kingHome) {
    return '🏰 Ziel: Bring deinen König mit der Rochade in Sicherheit!';
  }
  let undeveloped = 0;
  for (let c of [1,2,5,6]) { const p = game.board[homeRow][c]; if (p && (p.type==='n'||p.type==='b')) undeveloped++; }
  if (moveCount < 20 && undeveloped >= 2) {
    return '🐴 Ziel: Wecke deine Springer und Läufer auf — bring sie ins Spiel!';
  }
  const centerFiles=[3,4], centerRanks = color==='w' ? [3,4] : [3,4];
  let centerPawn = false;
  for (const cf of centerFiles) for (const cr of centerRanks) { const p = game.board[cr][cf]; if (p && p.color===color && p.type==='p') centerPawn = true; }
  if (moveCount < 16 && !centerPawn) {
    return '🎯 Ziel: Erobere mit einem Bauern die Mitte des Spielfelds!';
  }
  let myVal = 0, oppVal = 0;
  for (let r=0;r<8;r++) for (let c=0;c<8;c++){ const p = game.board[r][c]; if (!p) continue; const v = PIECE_VALUES[p.type]; if (p.color===color) myVal+=v; else oppVal+=v; }
  if (myVal - oppVal >= 3) {
    return '⚔️ Ziel: Du bist im Vorteil — greif mutig an!';
  }
  if (oppVal - myVal >= 3) {
    return '🛡️ Ziel: Pass gut auf deine Figuren auf und suche nach Chancen zum Zurückschlagen!';
  }
  return '👀 Ziel: Schau genau hin — steht jede deiner Figuren sicher?';
}

async function refreshCoachForPlayerTurn() {
  const g = state.game;
  // A fresh turn clears the last move's verdict — goal/suggestion take
  // over as the ambient guidance. Situational reactions (check, capture,
  // welcome) are left alone here so they stay readable until the player
  // actually acts again, instead of vanishing the instant it's their turn.
  setCoachSlot('verdict', null);
  if (g.turn !== state.playerColor || isGameOverStatus(g.gameStatus())) {
    setCoachSlot('goal', null);
    setCoachSlot('suggestion', null);
    state._coachBaseline = null;
    return;
  }
  setCoachSlot('goal', state.coachGoal ? { text: suggestGoal(g), tone: 'hint' } : null);
  // Baseline is computed whenever it's the player's turn — needed for move
  // quality tracking, streaks, and the adaptive engine, not only when the
  // "Zauber-Tipp" toggle is switched on.
  const analysis = getCoachAnalysis(g);
  if (!analysis || state.game !== g || g.turn !== state.playerColor) return;
  state._coachBaseline = analysis;
  // Snapshot of the position right before the player moves — needed if this
  // move turns out to be a mistake worth saving for the Fehler-Trainer.
  state._coachBaselineBoard = cloneBoard(g.board);
  state._coachBaselineTurn = g.turn;
  if (state.coachSuggest) {
    const label = coachMoveLabel(g, analysis.move);
    setCoachSlot('suggestion', { text: '🧙‍♂️ Zauber-Tipp: ' + label + ' — ' + explainMove(g, analysis.move), tone: 'tip' });
  } else {
    setCoachSlot('suggestion', null);
  }
}

function classifyCoachSwing(swing) {
  if (swing >= -20) return { emoji: '🌟', text: 'Wow, das war ein Super-Zug!' };
  if (swing >= -80) return { emoji: '😄', text: 'Klasse gemacht!' };
  if (swing >= -200) return { emoji: '🙂', text: 'Gut! Es ging noch ein kleines bisschen besser.' };
  if (swing >= -450) return { emoji: '🤔', text: 'Fast! Es gab einen noch besseren Zug.' };
  return { emoji: '💪', text: 'Kein Problem — das war nicht der beste Zug. Weiter geht\'s!' };
}

/* ==================== Fehler-Trainer ====================
   Positions where the child made a clearly avoidable mistake are saved and
   later resurface as small "find the better move" puzzles, on a light
   spaced-repetition schedule — solve one and it comes back further out
   each time, get it wrong and it comes back sooner. */
const MISTAKE_STORAGE_KEY = 'kids_schach_mistakes_v1';
const MISTAKE_SWING_THRESHOLD = -200; // capture anything rated 🤔 or worse
const MISTAKE_MAX_STORED = 40;
const MISTAKE_SUCCESS_INTERVALS_HOURS = [24, 72, 168, 384]; // 1, 3, 7, 16 days
const MISTAKE_RETRY_DELAY_HOURS = 3;

function boardToPieces(board) {
  const pieces = [];
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const p = board[r][c];
    if (p) pieces.push({ square: sqName(r, c), type: p.type, color: p.color });
  }
  return pieces;
}
function loadMistakes() {
  try { const raw = localStorage.getItem(MISTAKE_STORAGE_KEY); if (raw) return JSON.parse(raw); } catch (e) { /* ignore */ }
  return [];
}
function saveMistakes(list) { try { localStorage.setItem(MISTAKE_STORAGE_KEY, JSON.stringify(list)); } catch (e) { /* ignore */ } }
function dueMistakeCount() {
  const now = Date.now();
  return loadMistakes().filter(m => m.nextReviewAt <= now).length;
}
function addMistake(boardBefore, turn, playedSan, swing, playedFrom, playedTo) {
  const list = loadMistakes();
  list.push({
    id: 'm' + Date.now() + Math.random().toString(36).slice(2, 7),
    pieces: boardToPieces(boardBefore),
    turn,
    playedSan,
    playedFrom: playedFrom ? sqName(playedFrom.r, playedFrom.c) : null,
    playedTo: playedTo ? sqName(playedTo.r, playedTo.c) : null,
    swing,
    createdAt: Date.now(),
    nextReviewAt: Date.now(),
    stage: -1
  });
  while (list.length > MISTAKE_MAX_STORED) list.shift();
  saveMistakes(list);
  updateMistakeBadge();
}
function updateMistakeStageAfterAttempt(id, success) {
  const list = loadMistakes();
  const idx = list.findIndex(m => m.id === id);
  if (idx === -1) return;
  if (success) {
    const rec = list[idx];
    rec.stage = (rec.stage ?? -1) + 1;
    if (rec.stage >= MISTAKE_SUCCESS_INTERVALS_HOURS.length) {
      list.splice(idx, 1); // graduated — mastered, remove from rotation
    } else {
      rec.nextReviewAt = Date.now() + MISTAKE_SUCCESS_INTERVALS_HOURS[rec.stage] * 3600 * 1000;
    }
  } else {
    list[idx].stage = -1;
    list[idx].nextReviewAt = Date.now() + MISTAKE_RETRY_DELAY_HOURS * 3600 * 1000;
  }
  saveMistakes(list);
  updateMistakeBadge();
}
function updateMistakeBadge() {
  const badge = document.getElementById('mistakeBadge');
  const count = dueMistakeCount();
  if (count > 0) { badge.textContent = count > 9 ? '9+' : String(count); badge.classList.add('show'); }
  else badge.classList.remove('show');
}

// Runs after every player move (regardless of which coach toggles are on)
// so the streak counter, the adaptive engine, and the post-game review all
// have real data to work with. Pass a precomputedSwing when it was already
// worked out for the blunder check, so the (fairly expensive) analysis
// doesn't run twice for the same move.
function recordPlayerMoveQuality(baseline, san, precomputedSwing, boardBeforeMove, turnBeforeMove, playedFrom, playedTo) {
  if (!baseline) return;
  let swing = precomputedSwing;
  if (swing === undefined) {
    const afterAnalysis = getCoachAnalysis(state.game); // side to move now is the opponent
    const afterScoreForMover = afterAnalysis ? -afterAnalysis.score : 0;
    swing = afterScoreForMover - baseline.score;
  }
  const verdict = classifyCoachSwing(swing);

  state.gameMoveRecords.push({ san, swing, emoji: verdict.emoji, text: verdict.text, boardBefore: null });
  if (swing <= MISTAKE_SWING_THRESHOLD && boardBeforeMove) {
    addMistake(boardBeforeMove, turnBeforeMove, san, swing, playedFrom, playedTo);
  }

  setCoachSlot('verdict', state.coachEvaluate ? { text: verdict.emoji + ' ' + verdict.text, tone: swing >= -80 ? 'good' : 'hint' } : null);
  applyAdaptiveMoveResult(swing);
}

/* ==================== Threat radar ====================
   Only flags pieces that are genuinely hanging (attacked and NOT defended
   by another own piece) — a piece that's merely attacked but well guarded
   is completely normal in chess and would otherwise fire constantly,
   crowding out every other coach message. */
function findThreats(g, color) {
  const opponent = color === 'w' ? 'b' : 'w';
  const threats = [];
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const p = g.board[r][c];
    if (!(p && p.color === color && g.isSquareAttacked(r, c, opponent))) continue;
    if (g.isSquareAttacked(r, c, color)) continue; // defended — not hanging
    let attackerType = null;
    outer:
    for (let ar = 0; ar < 8; ar++) for (let ac = 0; ac < 8; ac++) {
      const ap = g.board[ar][ac];
      if (ap && ap.color === opponent) {
        const moves = g.pseudoMoves(ar, ac);
        if (moves.some(m => m.to.r === r && m.to.c === c)) { attackerType = ap.type; break outer; }
      }
    }
    threats.push({ r, c, piece: p.type, attacker: attackerType });
  }
  return threats;
}
function computeThreatsForBoard(g) {
  if (!(state.kidsHelp.threats && g.turn === state.playerColor)) { setCoachSlot('threat', null); return []; }
  const threats = findThreats(g, state.playerColor);
  if (!threats.length) { setCoachSlot('threat', null); return threats; }
  const t = threats[0];
  const pieceName = PIECE_NAME[t.piece];
  const sq = sqName(t.r, t.c);
  let msg = '⚠️ Dein ' + pieceName + ' auf ' + sq;
  msg += t.attacker ? (' wird von ' + PIECE_ARTICLE[t.attacker] + ' ' + PIECE_NAME_DAT[t.attacker] + ' bedroht!') : ' wird bedroht!';
  if (threats.length > 1) msg += ' (und ' + (threats.length - 1) + ' weitere)';
  setCoachSlot('threat', { text: msg, tone: 'threat' });
  return threats;
}

/* ==================== Single coach line ====================
   Everything the coach wants to say funnels through one visible line,
   picked by priority so the board stays the visual focus. */
const COACH_PRIORITY = ['threat', 'verdict', 'situational', 'goal', 'suggestion'];
function setCoachSlot(key, value) {
  state.coachMsg[key] = value;
  renderCoachLine();
}
function renderCoachLine() {
  const box = document.getElementById('coachLine');
  for (const key of COACH_PRIORITY) {
    const entry = state.coachMsg[key];
    if (entry) {
      box.className = 'coach-line show tone-' + entry.tone;
      box.textContent = entry.text;
      return;
    }
  }
  box.classList.remove('show');
}

/* ==================== Game flow ==================== */
function getAIMove(game) {
  return chooseKidsMove(game, currentKidsConfig(), state.personality);
}

function newGame() {
  state.selected = null;
  state.legalForSelected = [];
  state.aiThinking = false;
  state.resultRecorded = false;
  state.lastMove = null;
  state._coachBaseline = null;
  state._pendingCandidate = null;
  state._pendingSwing = undefined;
  state.gameMoveRecords = [];
  state.goodStreak = 0; state.poorStreak = 0; state.moveStreak = 0;
  state.seenTips = new Set(); // fresh reactions each game, instead of a lifetime one-shot
  state.coachMsg = { threat: null, verdict: null, situational: null, goal: null, suggestion: null };
  renderCoachLine();
  document.getElementById('warumBar').classList.remove('show');
  document.getElementById('resultOverlay').classList.remove('show');
  state.game = new ChessGame({ chess960: false });
  render();
  showWelcomeTipIfNeeded();
  renderAdaptiveStatus();
  if (state.playerColor === 'b') {
    state.aiThinking = true;
    renderStatus();
    (async () => {
      const [aiMove] = await Promise.all([Promise.resolve(getAIMove(state.game)), delay(MIN_AI_MOVE_DELAY_MS)]);
      if (aiMove) {
        state.game.move({ from: aiMove.from, to: aiMove.to, castle: aiMove.castle, promoteTo: aiMove.promoteTo || 'q' });
        state.lastMove = { from: aiMove.from, to: aiMove.to };
        playMoveFeedback(!!aiMove.capture);
      }
      state.aiThinking = false;
      render();
      checkSituationTips();
      checkGameEndModal();
      saveGame();
      refreshCoachForPlayerTurn();
    })();
  } else {
    refreshCoachForPlayerTurn();
  }
  saveGame();
}

function pieceSpan(p) {
  const span = document.createElement('span');
  span.className = 'piece piece-' + p.color;
  span.textContent = PIECE_CHARS[p.color][p.type];
  return span;
}
function boardCoords() {
  const order = state.playerColor === 'b' ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];
  return { rows: order, cols: order };
}

function render() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  const g = state.game;

  const showMoveHints = state.kidsHelp.moves;
  const targetSet = showMoveHints ? new Set(state.legalForSelected.map(m => m.to.r + '-' + m.to.c)) : new Set();
  const targetMoveByKey = {};
  if (showMoveHints) state.legalForSelected.forEach(m => targetMoveByKey[m.to.r + '-' + m.to.c] = m);

  const threats = computeThreatsForBoard(g);
  const threatened = new Set(threats.map(t => t.r + '-' + t.c));

  let kingInCheck = null;
  if (g.inCheck(g.turn)) kingInCheck = g.findKingOn(g.board, g.turn);

  const { rows, cols } = boardCoords();
  rows.forEach((r, rowIdx) => {
    cols.forEach((c, colIdx) => {
      const sqEl = document.createElement('div');
      sqEl.className = 'sq';
      sqEl.dataset.r = r; sqEl.dataset.c = c;
      const p = g.board[r][c];
      if (p) sqEl.appendChild(pieceSpan(p));

      if (state.selected && state.selected.r === r && state.selected.c === c) sqEl.classList.add('selected');
      if (state.lastMove && ((state.lastMove.from.r === r && state.lastMove.from.c === c) || (state.lastMove.to.r === r && state.lastMove.to.c === c))) {
        sqEl.classList.add('last-move');
      }
      if (kingInCheck && kingInCheck.r === r && kingInCheck.c === c) sqEl.classList.add('in-check');
      const key = r + '-' + c;
      if (targetSet.has(key)) {
        const hint = document.createElement('div');
        hint.className = 'hint' + (targetMoveByKey[key].capture ? ' capture' : '');
        sqEl.appendChild(hint);
      }
      if (threatened.has(key)) sqEl.classList.add('threatened');

      if (colIdx === 0) {
        const rankLabel = document.createElement('span');
        rankLabel.className = 'coord-label rank';
        rankLabel.textContent = 8 - r;
        sqEl.appendChild(rankLabel);
      }
      if (rowIdx === rows.length - 1) {
        const fileLabel = document.createElement('span');
        fileLabel.className = 'coord-label file';
        fileLabel.textContent = 'abcdefgh'[c];
        sqEl.appendChild(fileLabel);
      }

      sqEl.addEventListener('click', () => onSquareClick(r, c));
      boardEl.appendChild(sqEl);
    });
  });

  renderCaptured();
  renderStatus();
  if (state.showMoveHistory) renderMoveHistory();
}

function renderCaptured() {
  const g = state.game;
  const whiteCaptured = g.captured.b;
  const blackCaptured = g.captured.w;
  const whiteValue = whiteCaptured.reduce((sum, t) => sum + PIECE_VALUES[t], 0);
  const blackValue = blackCaptured.reduce((sum, t) => sum + PIECE_VALUES[t], 0);
  const diff = whiteValue - blackValue;
  document.getElementById('capturedByWhite').textContent = whiteCaptured.map(t => PIECE_CHARS.b[t]).join(' ') + (diff > 0 ? ' +' + diff : '');
  document.getElementById('capturedByBlack').textContent = blackCaptured.map(t => PIECE_CHARS.w[t]).join(' ') + (diff < 0 ? ' +' + (-diff) : '');
}

function renderStatus() {
  const g = state.game;
  const bar = document.getElementById('statusBar');
  if (state.aiThinking) { bar.textContent = '🦊 Der Fuchs überlegt …'; return; }
  const status = g.gameStatus();
  const turnName = g.turn === 'w' ? 'Weiß' : 'Schwarz';
  if (status === 'checkmate') { const winner = g.turn === 'w' ? 'Schwarz' : 'Weiß'; bar.textContent = 'Schachmatt — ' + winner + ' gewinnt!'; }
  else if (status === 'stalemate') bar.textContent = 'Patt — Remis.';
  else if (status === 'draw-fifty') bar.textContent = 'Remis — 50-Züge-Regel.';
  else if (status === 'draw-repetition') bar.textContent = 'Remis — Stellungswiederholung.';
  else if (status === 'check') bar.textContent = turnName + ' steht im Schach.';
  else bar.textContent = turnName + ' ist am Zug.';
}

function renderMoveHistory() {
  const el = document.getElementById('moveHistoryPanel');
  const hist = state.game.history;
  let html = '';
  for (let i = 0; i < hist.length; i += 2) {
    const num = Math.floor(i / 2) + 1;
    const m1 = hist[i] ? hist[i].san : '';
    const m2 = hist[i + 1] ? hist[i + 1].san : '';
    html += `<div class="hist-row"><span class="hist-num">${num}.</span><span class="hist-move">${m1}</span><span class="hist-move">${m2}</span></div>`;
  }
  el.innerHTML = html || '<div class="hist-empty">Noch keine Züge.</div>';
  el.scrollTop = el.scrollHeight;
}

function onSquareClick(r, c) {
  if (state.aiThinking) return;
  const g = state.game;
  if (g.turn !== state.playerColor) return;
  if (isGameOverStatus(g.gameStatus())) return;
  if (document.getElementById('warumBar').classList.contains('show')) return; // resolve the pending prompt first

  const p = g.board[r][c];

  if (state.selected) {
    const match = state.legalForSelected.find(m => m.to.r === r && m.to.c === c);
    if (match) { handleMoveSelection(match); return; }
  }

  if (p && p.color === state.playerColor) {
    state.selected = { r, c };
    state.legalForSelected = g.legalMoves(state.playerColor).filter(m => m.from.r === r && m.from.c === c);
    if (state.kidsHelp.tips) showSelectionTip(p, state.legalForSelected);
    render();
  } else {
    state.selected = null;
    state.legalForSelected = [];
    render();
  }
}

// Only genuinely large material blunders (losing a queen/rook for nothing,
// roughly) interrupt the flow with a confirmation — small inaccuracies are
// just played out and picked up afterwards by the move-quality feedback,
// so the game doesn't stop-and-ask on every move.
const BLUNDER_SWING_THRESHOLD = -450;

// Generic version: how much does `move` change the mover's score relative
// to `baselineScore`, on any ChessGame instance (used for the live game's
// blunder check and for evaluating guesses in the Fehler-Trainer).
function evaluateMoveSwing(game, baselineScore, move) {
  const snap = snapshot(game);
  game.move({ from: move.from, to: move.to, castle: move.castle, promoteTo: move.promoteTo || 'q' });
  const afterAnalysis = getCoachAnalysis(game);
  const afterScoreForMover = afterAnalysis ? -afterAnalysis.score : 0;
  const swing = afterScoreForMover - baselineScore;
  restore(game, snap);
  return swing;
}
function evaluateCandidateSwing(move) {
  const baseline = state._coachBaseline;
  if (!baseline) return 0;
  return evaluateMoveSwing(state.game, baseline.score, move);
}
// Whether this move leaves one of the player's OWN pieces hanging (attacked
// and undefended) right away — as opposed to merely not being the single
// best move on the board (e.g. missing a free enemy piece elsewhere, which
// produces the same kind of large negative "swing" but isn't actually
// dangerous for the player). Only the former deserves an interrupting
// confirmation.
function moveHangsOwnMaterial(move) {
  const g = state.game;
  const color = g.turn;
  const snap = snapshot(g);
  g.move({ from: move.from, to: move.to, castle: move.castle, promoteTo: move.promoteTo || 'q' });
  const hanging = findThreats(g, color);
  restore(g, snap);
  return hanging.length > 0;
}

function handleMoveSelection(move) {
  if (move.promotion) { openPromotionModal(move); return; }
  if (state.warnOnBlunder && state._coachBaseline) {
    const swing = evaluateCandidateSwing(move);
    if (swing <= BLUNDER_SWING_THRESHOLD && moveHangsOwnMaterial(move)) { showWarumNichtPrompt(move, swing); return; }
    commitMove(move, swing);
    return;
  }
  commitMove(move);
}

/* ---- Blunder check — preview feedback before a clearly bad move is committed ---- */
function showWarumNichtPrompt(move, swing) {
  const baseline = state._coachBaseline;
  const label = coachMoveLabel(state.game, baseline.move);
  document.getElementById('warumText').textContent = '🤔 Das könnte eine wertvolle Figur kosten! Der Zauber-Tipp wäre ' + label + ' gewesen. Trotzdem ziehen?';
  document.getElementById('warumBar').classList.add('show');
  state._pendingCandidate = move;
  state._pendingSwing = swing;
  state.selected = null;
  render();
  document.getElementById('warumBar').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function commitMove(move, precomputedSwing) {
  const g = state.game;
  const playedFrom = move.from, playedTo = move.to;
  const wasCapture = !!move.capture;
  const coachBaseline = state._coachBaseline;
  const boardBeforeMove = state._coachBaselineBoard;
  const turnBeforeMove = state._coachBaselineTurn;
  const found = g.move({ from: move.from, to: move.to, castle: move.castle, promoteTo: move.promoteTo });
  const san = found ? found.san : '';
  state.lastMove = { from: playedFrom, to: playedTo };
  playMoveFeedback(wasCapture);
  state.selected = null;
  state.legalForSelected = [];
  setCoachSlot('suggestion', null);
  setCoachSlot('goal', null);
  setCoachSlot('situational', null); // retire the reaction to whatever happened last turn
  document.getElementById('warumBar').classList.remove('show');
  state._coachBaseline = null;
  state._coachBaselineBoard = null;
  state._coachBaselineTurn = null;
  state._pendingCandidate = null;
  state._pendingSwing = undefined;

  render();
  checkSituationTips();
  recordPlayerMoveQuality(coachBaseline, san, precomputedSwing, boardBeforeMove, turnBeforeMove, playedFrom, playedTo);

  const status = g.gameStatus();
  if (isGameOverStatus(status)) { checkGameEndModal(); saveGame(); return; }

  state.aiThinking = true;
  renderStatus();
  saveGame();
  (async () => {
    const [aiMove] = await Promise.all([Promise.resolve(getAIMove(g)), delay(MIN_AI_MOVE_DELAY_MS)]);
    if (aiMove) {
      g.move({ from: aiMove.from, to: aiMove.to, castle: aiMove.castle, promoteTo: aiMove.promoteTo || 'q' });
      state.lastMove = { from: aiMove.from, to: aiMove.to };
      playMoveFeedback(!!aiMove.capture);
    }
    state.aiThinking = false;
    render();
    checkSituationTips();
    checkGameEndModal();
    saveGame();
    refreshCoachForPlayerTurn();
  })();
}

function openPromotionModal(move) {
  const overlay = document.getElementById('promoOverlay');
  const row = document.getElementById('promoRow');
  row.innerHTML = '';
  ['q','r','b','n'].forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'promo-btn';
    btn.textContent = PIECE_CHARS[state.playerColor][opt];
    btn.addEventListener('click', () => {
      overlay.classList.remove('show');
      const withPromo = { ...move, promoteTo: opt };
      if (state.warnOnBlunder && state._coachBaseline) {
        const swing = evaluateCandidateSwing(withPromo);
        if (swing <= BLUNDER_SWING_THRESHOLD && moveHangsOwnMaterial(withPromo)) { showWarumNichtPrompt(withPromo, swing); return; }
        commitMove(withPromo, swing);
        return;
      }
      commitMove(withPromo);
    });
    row.appendChild(btn);
  });
  overlay.classList.add('show');
}

// Only the less-obvious special rules get a one-time explanation — how each
// piece moves is assumed to be known already.
function showSelectionTip(piece, moves) {
  if (!state.kidsHelp.tips) return;
  const castleMove = moves.find(m => m.castle);
  const epMove = moves.find(m => m.enpassant);
  const promoMove = moves.find(m => m.promotion);

  let msg = null;
  if (castleMove && !state.seenTips.has('castle')) { msg = '👑 Rochade! König und Turm dürfen hier gemeinsam ziehen — dein König wird sicherer.'; state.seenTips.add('castle'); }
  else if (epMove && !state.seenTips.has('ep')) { msg = '✨ En passant! Dein Bauer darf hier einen gegnerischen Bauern im Vorbeigehen schlagen.'; state.seenTips.add('ep'); }
  else if (promoMove && !state.seenTips.has('promo')) { msg = '⭐ Fast geschafft! Wenn dein Bauer die letzte Reihe erreicht, wird er zu einer starken Figur.'; state.seenTips.add('promo'); }

  // Only overwrite the coach line when there's actually a new special-move
  // tip to show — otherwise leave whatever reactive message (check,
  // capture, welcome) is already there so it stays readable.
  if (msg) setCoachSlot('situational', { text: msg, tone: 'tip' });
}

function checkSituationTips() {
  if (!state.kidsHelp.tips) return;
  const g = state.game;
  const status = g.gameStatus();
  const opponentColor = state.playerColor === 'w' ? 'b' : 'w';
  const isPlayerTurn = g.turn === state.playerColor;

  const candidates = [
    { key: 'check', cond: status === 'check', text: isPlayerTurn ? '⚡ Schach! Dein König wird angegriffen — du musst ihn jetzt beschützen.' : '🎉 Schach! Du hast den König deines Gegners angegriffen.' },
    { key: 'capture-good', cond: g.captured[opponentColor].length > 0, text: '🎉 Du hast eine gegnerische Figur geschlagen! Stark gemacht.' },
    { key: 'capture-lost', cond: g.captured[state.playerColor].length > 0, text: '😊 Der Fuchs hat eine deiner Figuren geschlagen. Das passiert jedem — einfach weiterspielen!' }
  ];
  for (const c of candidates) {
    if (c.cond && !state.seenTips.has(c.key)) {
      setCoachSlot('situational', { text: c.text, tone: 'tip' });
      state.seenTips.add(c.key);
      return;
    }
  }
}

function showWelcomeTipIfNeeded() {
  if (!state.kidsHelp.tips) return;
  if (state.game.history.length > 0) return;
  if (state.seenTips.has('welcome')) return;
  setCoachSlot('situational', { text: '👋 Willkommen im Schach-Abenteuer! Tippe auf eine Figur, um zu sehen, wohin sie ziehen darf.', tone: 'tip' });
  state.seenTips.add('welcome');
}

// Undoes one full pair (the child's last move and the fox's reply), not
// the whole game — same as tapping through a couple of moves manually.
function undoLastPair() {
  const g = state.game;
  if (g.history.length === 0) return;
  const stripCount = Math.min(2, g.history.length);
  const movesToReplay = g.history.slice(0, g.history.length - stripCount);
  const fresh = new ChessGame({ chess960: false });
  for (const m of movesToReplay) {
    fresh.move({ from: m.from, to: m.to, castle: m.castle, promoteTo: m.promoteTo });
  }
  state.game = fresh;
  state.selected = null;
  state.legalForSelected = [];
  state.resultRecorded = false;
  state._coachBaseline = null;
  state._pendingCandidate = null;
  state._pendingSwing = undefined;
  if (state.gameMoveRecords.length) state.gameMoveRecords.pop();
  state.goodStreak = 0; state.poorStreak = 0; state.moveStreak = 0;
  state.coachMsg = { threat: null, verdict: null, situational: null, goal: null, suggestion: null };
  renderCoachLine();
  document.getElementById('warumBar').classList.remove('show');
  state.lastMove = movesToReplay.length
    ? { from: movesToReplay[movesToReplay.length - 1].from, to: movesToReplay[movesToReplay.length - 1].to }
    : null;
  document.getElementById('resultOverlay').classList.remove('show');
  render();
  refreshCoachForPlayerTurn();
}

/* ==================== Post-game review ==================== */
function renderReview() {
  const content = document.getElementById('reviewContent');
  const boardEl = document.getElementById('reviewBoard');
  boardEl.classList.remove('show');
  const records = state.gameMoveRecords;
  if (!records.length) { content.innerHTML = '<div class="review-empty">Für diese Partie gibt es noch keinen Rückblick.</div>'; return; }

  const sorted = [...records].sort((a, b) => b.swing - a.swing);
  const best = sorted.slice(0, 3).filter(r => r.swing >= -80);
  const worst = [...sorted].reverse().slice(0, 2).filter(r => r.swing < -80);

  let html = '';
  if (best.length) {
    html += '<div class="section-label" style="text-align:left;">Deine stärksten Züge</div>';
    best.forEach(r => { html += reviewItemHtml(r); });
  }
  if (worst.length) {
    html += '<div class="section-label" style="text-align:left; margin-top:10px;">Da war noch Luft nach oben</div>';
    worst.forEach(r => { html += reviewItemHtml(r); });
  }
  if (!best.length && !worst.length) {
    html += '<div class="review-empty">Solide Partie — keine besonderen Ausreißer nach oben oder unten!</div>';
  }
  content.innerHTML = html;
}
function reviewItemHtml(r) {
  return `<div class="review-item"><div class="ri-head"><span>${r.san}</span><span>${r.emoji}</span></div><div class="ri-text">${r.text}</div></div>`;
}

/* ---- Fehler-Trainer: puzzle presentation & interaction ---- */
let trainerState = { queue: [], index: 0, game: null, selected: null, legalForSelected: [], answered: false };

function openTrainer() {
  const now = Date.now();
  trainerState.queue = loadMistakes().filter(m => m.nextReviewAt <= now).sort((a, b) => a.nextReviewAt - b.nextReviewAt);
  trainerState.index = 0;
  document.getElementById('trainerOverlay').classList.add('show');
  loadTrainerPuzzle();
}
function closeTrainer() {
  document.getElementById('trainerOverlay').classList.remove('show');
  updateMistakeBadge();
}
function loadTrainerPuzzle() {
  const feedback = document.getElementById('trainerFeedback');
  const nextBtn = document.getElementById('trainerNextBtn');
  const wrapEl = document.getElementById('trainerBoardWrap');
  const emptyEl = document.getElementById('trainerEmptyMsg');
  const promptEl = document.getElementById('trainerPrompt');
  const contextEl = document.getElementById('trainerContext');
  const turnLabelEl = document.getElementById('trainerTurnLabel');
  feedback.classList.remove('show');
  nextBtn.style.display = 'none';
  trainerState.answered = false;
  trainerState.selected = null;
  trainerState.legalForSelected = [];
  trainerState.lastGuessMove = null;
  clearTrainerArrow();

  if (trainerState.index >= trainerState.queue.length) {
    wrapEl.style.display = 'none';
    emptyEl.style.display = 'block';
    const remaining = loadMistakes().length;
    promptEl.textContent = '';
    contextEl.classList.remove('show');
    turnLabelEl.textContent = '';
    emptyEl.textContent = '🎉 Super, gerade nichts Fälliges zu üben!' +
      (remaining > 0 ? ' Die restlichen Stellungen kommen wieder, wenn es Zeit dafür ist.' : ' Sobald mal ein Zug nicht ganz optimal war, taucht er hier später als kleines Rätsel auf.');
    return;
  }
  wrapEl.style.display = '';
  emptyEl.style.display = 'none';
  const rec = trainerState.queue[trainerState.index];
  trainerState.game = new ChessGame({ customPieces: rec.pieces, turn: rec.turn });
  trainerState.currentRecord = rec;

  const turnLabel = rec.turn === 'w' ? 'Weiß' : 'Schwarz';
  turnLabelEl.textContent = (rec.turn === 'w' ? '⚪' : '⚫') + ' ' + turnLabel + ' ist am Zug — das sind deine Figuren, unten im Bild.';
  contextEl.classList.add('show');
  contextEl.textContent = rec.playedFrom && rec.playedTo
    ? '📍 Genau hier hast du zuletzt ' + rec.playedSan + ' gespielt (gelb markiert, ① Start, ② Ziel) — das war nicht die beste Wahl.'
    : '📍 Genau hier hast du zuletzt ' + rec.playedSan + ' gespielt — das war nicht die beste Wahl.';
  promptEl.textContent = '👉 Finde jetzt einen besseren Zug! Tippe deine Figur an und dann das Feld, wohin sie soll.';
  renderTrainerBoard();
}
function renderTrainerBoard() {
  const boardEl = document.getElementById('trainerBoard');
  boardEl.innerHTML = '';
  const g = trainerState.game;
  const rec = trainerState.currentRecord;
  const targetSet = new Set(trainerState.legalForSelected.map(m => m.to.r + '-' + m.to.c));
  const targetMoveByKey = {};
  trainerState.legalForSelected.forEach(m => targetMoveByKey[m.to.r + '-' + m.to.c] = m);
  const playedFromRC = rec.playedFrom ? squareToRC(rec.playedFrom) : null;
  const playedToRC = rec.playedTo ? squareToRC(rec.playedTo) : null;
  // Once answered, the highlight switches to the child's own just-played
  // guess instead of the stale original-mistake squares.
  const highlightFrom = (trainerState.answered && trainerState.lastGuessMove) ? trainerState.lastGuessMove.from : playedFromRC;
  const highlightTo = (trainerState.answered && trainerState.lastGuessMove) ? trainerState.lastGuessMove.to : playedToRC;

  // Always shown from the solver's own perspective — their pieces at the
  // bottom, matching how the main board orients play.
  const order = rec.turn === 'b' ? [7, 6, 5, 4, 3, 2, 1, 0] : [0, 1, 2, 3, 4, 5, 6, 7];
  for (const r of order) {
    for (const c of order) {
      const sqEl = document.createElement('div');
      sqEl.className = 'sq';
      const p = g.board[r][c];
      if (p) sqEl.appendChild(pieceSpan(p));
      if (trainerState.selected && trainerState.selected.r === r && trainerState.selected.c === c) sqEl.classList.add('selected');
      if (highlightFrom && highlightFrom.r === r && highlightFrom.c === c) sqEl.classList.add('was-played', 'was-played-from');
      if (highlightTo && highlightTo.r === r && highlightTo.c === c) sqEl.classList.add('was-played', 'was-played-to');
      const key = r + '-' + c;
      if (targetSet.has(key)) {
        const hint = document.createElement('div');
        hint.className = 'hint' + (targetMoveByKey[key].capture ? ' capture' : '');
        sqEl.appendChild(hint);
      }
      if (!trainerState.answered) sqEl.addEventListener('click', () => onTrainerSquareClick(r, c));
      boardEl.appendChild(sqEl);
    }
  }
}
function onTrainerSquareClick(r, c) {
  if (trainerState.answered) return;
  const g = trainerState.game;
  const p = g.board[r][c];
  if (trainerState.selected) {
    const match = trainerState.legalForSelected.find(m => m.to.r === r && m.to.c === c);
    if (match) { submitTrainerGuess(match); return; }
  }
  if (p && p.color === g.turn) {
    trainerState.selected = { r, c };
    trainerState.legalForSelected = g.legalMoves(g.turn).filter(m => m.from.r === r && m.from.c === c);
  } else {
    trainerState.selected = null;
    trainerState.legalForSelected = [];
  }
  renderTrainerBoard();
}

/* ---- Arrow overlay showing the recommended move when a guess is wrong ---- */
function trainerVisualCenter(r, c, turn) {
  const order = turn === 'b' ? [7, 6, 5, 4, 3, 2, 1, 0] : [0, 1, 2, 3, 4, 5, 6, 7];
  return { x: order.indexOf(c) + 0.5, y: order.indexOf(r) + 0.5 };
}
function clearTrainerArrow() {
  const svg = document.getElementById('trainerArrowSvg');
  const group = svg.querySelector('.trainer-arrow-line');
  if (group) group.remove();
}
function drawTrainerArrow(fromRC, toRC, turn) {
  clearTrainerArrow();
  const svg = document.getElementById('trainerArrowSvg');
  const a = trainerVisualCenter(fromRC.r, fromRC.c, turn);
  const b = trainerVisualCenter(toRC.r, toRC.c, turn);
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len;
  // Shrink both ends so the line starts clear of the origin piece and stops
  // just short of the target square, leaving room for the arrowhead.
  const x1 = a.x + ux * 0.32, y1 = a.y + uy * 0.32;
  const x2 = b.x - ux * 0.42, y2 = b.y - uy * 0.42;

  const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  group.setAttribute('class', 'trainer-arrow-line');

  // Soft light halo first so the thin line still reads clearly against
  // both light and dark squares.
  const halo = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  halo.setAttribute('x1', x1); halo.setAttribute('y1', y1);
  halo.setAttribute('x2', x2); halo.setAttribute('y2', y2);
  halo.setAttribute('stroke', '#ffffff');
  halo.setAttribute('stroke-width', '0.16');
  halo.setAttribute('stroke-linecap', 'round');
  halo.setAttribute('opacity', '0.7');
  group.appendChild(halo);

  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', x1); line.setAttribute('y1', y1);
  line.setAttribute('x2', x2); line.setAttribute('y2', y2);
  line.setAttribute('stroke', '#1a9850');
  line.setAttribute('stroke-width', '0.07');
  line.setAttribute('stroke-linecap', 'round');
  line.setAttribute('marker-end', 'url(#trainerArrowHead)');
  group.appendChild(line);

  svg.appendChild(group);
}

function submitTrainerGuess(move) {
  const g = trainerState.game;
  const rec = trainerState.currentRecord;
  const baseline = getCoachAnalysis(g);
  const guessSwing = baseline ? evaluateMoveSwing(g, baseline.score, { ...move, promoteTo: move.promoteTo || 'q' }) : 0;
  const success = guessSwing >= -80;
  g.move({ from: move.from, to: move.to, castle: move.castle, promoteTo: move.promoteTo || 'q' }); // actually play it out so the board reflects the guess
  trainerState.answered = true;
  trainerState.lastGuessMove = move;
  trainerState.selected = null;
  trainerState.legalForSelected = [];
  renderTrainerBoard();

  const feedback = document.getElementById('trainerFeedback');
  feedback.classList.add('show');
  if (success) {
    feedback.className = 'coach-line show tone-good';
    feedback.textContent = '🌟 Klasse — diesmal hast du einen guten Zug gefunden, statt ' + rec.playedSan + ' wie beim letzten Mal!';
  } else {
    const label = baseline ? coachMoveLabel(g, baseline.move) : '';
    feedback.className = 'coach-line show tone-hint';
    feedback.textContent = '💡 Noch nicht ganz — ' + (label ? ('der grüne Pfeil zeigt dir einen starken Zug: ' + label + '. ') : '') + 'Kein Problem, beim nächsten Mal klappt\'s bestimmt!';
    if (baseline) drawTrainerArrow(baseline.move.from, baseline.move.to, rec.turn);
  }
  updateMistakeStageAfterAttempt(rec.id, success);
  document.getElementById('trainerNextBtn').style.display = 'block';
}

/* ==================== Save / load / backup ==================== */
function saveGame() {
  try {
    const data = {
      playerColor: state.playerColor,
      kidsHelp: state.kidsHelp,
      kidsDifficulty: state.kidsDifficulty,
      personality: state.personality,
      coachSuggest: state.coachSuggest,
      coachEvaluate: state.coachEvaluate,
      coachGoal: state.coachGoal,
      warnOnBlunder: state.warnOnBlunder,
      seenTips: Array.from(state.seenTips),
      resultRecorded: state.resultRecorded,
      adaptiveLevel: state.adaptiveLevel,
      moves: state.game.history.map(m => ({ from: m.from, to: m.to, castle: m.castle, promoteTo: m.promoteTo }))
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) { /* storage unavailable — game still works, just won't persist */ }
}

function exportBackup() {
  const data = { exportedAt: new Date().toISOString(), save: localStorage.getItem(STORAGE_KEY), stats: localStorage.getItem(STATS_KEY), mistakes: localStorage.getItem(MISTAKE_STORAGE_KEY) };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'schach-abenteuer-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importBackupFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (data.save) localStorage.setItem(STORAGE_KEY, data.save);
      if (data.stats) localStorage.setItem(STATS_KEY, data.stats);
      if (data.mistakes) localStorage.setItem(MISTAKE_STORAGE_KEY, data.mistakes);
      alert('Backup wiederhergestellt! Die App lädt jetzt neu.');
      location.reload();
    } catch (e) {
      alert('Diese Datei konnte nicht gelesen werden — ist es wirklich ein Backup vom Schach-Abenteuer?');
    }
  };
  reader.readAsText(file);
}

function loadGame() {
  let raw;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }
  if (!raw) return false;
  try {
    const data = JSON.parse(raw);
    state.playerColor = data.playerColor || 'w';
    state.kidsHelp = data.kidsHelp || { moves: true, threats: true, tips: true };
    state.kidsDifficulty = data.kidsDifficulty || 'adaptive';
    state.personality = data.personality || 'balanced';
    state.coachSuggest = data.coachSuggest || false;
    state.coachEvaluate = data.coachEvaluate || false;
    state.coachGoal = data.coachGoal || false;
    state.warnOnBlunder = data.warnOnBlunder !== undefined ? data.warnOnBlunder : true;
    state.adaptiveLevel = typeof data.adaptiveLevel === 'number' ? data.adaptiveLevel : 0;
    state._coachBaseline = null;
    state._pendingCandidate = null;
    state.gameMoveRecords = [];
    state.goodStreak = 0; state.poorStreak = 0; state.moveStreak = 0;
    state.seenTips = new Set(data.seenTips || []);
    state.selected = null;
    state.legalForSelected = [];
    state.aiThinking = false;

    const fresh = new ChessGame({ chess960: false });
    for (const m of (data.moves || [])) fresh.move({ from: m.from, to: m.to, castle: m.castle, promoteTo: m.promoteTo });
    state.game = fresh;
    const savedMoves = data.moves || [];
    state.lastMove = savedMoves.length ? { from: savedMoves[savedMoves.length - 1].from, to: savedMoves[savedMoves.length - 1].to } : null;
    state.resultRecorded = data.resultRecorded || false;

    document.querySelectorAll('#colorRow .diff-btn').forEach(b => b.classList.toggle('active', b.dataset.color === state.playerColor));
    document.querySelectorAll('#kidsHelpRow .diff-btn').forEach(b => b.classList.toggle('active', !!state.kidsHelp[b.dataset.help]));
    document.querySelectorAll('#kidsDiffRow .diff-btn').forEach(b => b.classList.toggle('active', b.dataset.kidsdiff === state.kidsDifficulty));
    document.querySelectorAll('#kidsPersonalityRow .diff-btn').forEach(b => b.classList.toggle('active', b.dataset.kidspersonality === state.personality));
    document.querySelectorAll('#kidsCoachRow .diff-btn').forEach(b => {
      const key = b.dataset.kidscoach;
      const active = key === 'suggest' ? state.coachSuggest : key === 'evaluate' ? state.coachEvaluate : state.coachGoal;
      b.classList.toggle('active', active);
    });
    document.querySelectorAll('#warnRow .diff-btn').forEach(b => b.classList.toggle('active', state.warnOnBlunder));
    renderAdaptiveStatus();
    render();
    showWelcomeTipIfNeeded();
    refreshCoachForPlayerTurn();
    return true;
  } catch (e) {
    return false;
  }
}

/* ==================== Event wiring ==================== */
document.querySelectorAll('#colorRow .diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    state.playerColor = btn.dataset.color;
    document.querySelectorAll('#colorRow .diff-btn').forEach(b => b.classList.toggle('active', b === btn));
    newGame();
  });
});
document.querySelectorAll('#kidsDiffRow .diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    state.kidsDifficulty = btn.dataset.kidsdiff;
    document.querySelectorAll('#kidsDiffRow .diff-btn').forEach(b => b.classList.toggle('active', b === btn));
    renderAdaptiveStatus();
    saveGame();
  });
});
document.querySelectorAll('#kidsPersonalityRow .diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    state.personality = btn.dataset.kidspersonality;
    document.querySelectorAll('#kidsPersonalityRow .diff-btn').forEach(b => b.classList.toggle('active', b === btn));
    saveGame();
  });
});
document.querySelectorAll('#kidsHelpRow .diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.help;
    state.kidsHelp[key] = !state.kidsHelp[key];
    btn.classList.toggle('active', state.kidsHelp[key]);
    render();
    saveGame();
  });
});
document.querySelectorAll('#kidsCoachRow .diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.kidscoach;
    if (key === 'suggest') state.coachSuggest = !state.coachSuggest;
    if (key === 'evaluate') state.coachEvaluate = !state.coachEvaluate;
    if (key === 'goal') state.coachGoal = !state.coachGoal;
    const active = key === 'suggest' ? state.coachSuggest : key === 'evaluate' ? state.coachEvaluate : state.coachGoal;
    btn.classList.toggle('active', active);
    if (!state.coachEvaluate) setCoachSlot('verdict', null);
    refreshCoachForPlayerTurn();
    saveGame();
  });
});
document.querySelectorAll('#warnRow .diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    state.warnOnBlunder = !state.warnOnBlunder;
    btn.classList.toggle('active', state.warnOnBlunder);
    saveGame();
  });
});

document.getElementById('newGameBtn').addEventListener('click', () => {
  const g = state.game;
  const midGame = g && g.history.length >= 4 && !isGameOverStatus(g.gameStatus());
  if (midGame && !confirm('Deine laufende Partie ist noch nicht beendet. Wirklich eine neue Partie starten und die aktuelle aufgeben?')) return;
  newGame();
});
document.getElementById('undoBtn').addEventListener('click', () => { undoLastPair(); saveGame(); });

document.getElementById('resultNewGameBtn').addEventListener('click', () => {
  document.getElementById('resultOverlay').classList.remove('show');
  newGame();
});
document.getElementById('resultCloseBtn').addEventListener('click', () => {
  document.getElementById('resultOverlay').classList.remove('show');
});
document.getElementById('resultReviewBtn').addEventListener('click', () => {

document.getElementById('reviewCloseBtn').addEventListener('click', () => {
  document.getElementById('reviewOverlay').classList.remove('show');
});

document.getElementById('statsBtn').addEventListener('click', () => {
  renderStatsContent();
  document.getElementById('statsOverlay').classList.add('show');
});
document.getElementById('statsCloseBtn').addEventListener('click', () => {
  document.getElementById('statsOverlay').classList.remove('show');
});
document.getElementById('statsResetBtn').addEventListener('click', () => {
  if (confirm('Wirklich die gesamte Sieg/Niederlage-Statistik löschen? Das kann nicht rückgängig gemacht werden.')) {
    saveStats({ w: 0, l: 0, d: 0 });
    renderStatsContent();
  }
});

document.getElementById('settingsOpenBtn').addEventListener('click', () => {
  document.getElementById('settingsOverlay').classList.add('show');
});
document.getElementById('settingsCloseBtn').addEventListener('click', () => {
  document.getElementById('settingsOverlay').classList.remove('show');
});
document.getElementById('backupExportBtn').addEventListener('click', exportBackup);
document.getElementById('backupImportBtn').addEventListener('click', () => {
  document.getElementById('backupFileInput').click();
});
document.getElementById('backupFileInput').addEventListener('change', (e) => {
  if (e.target.files && e.target.files[0]) importBackupFile(e.target.files[0]);
});
document.getElementById('adaptiveResetBtn').addEventListener('click', () => {
  if (confirm('Das adaptive Niveau des Fuchses auf den Standardwert zurücksetzen?')) {
    resetAdaptiveLevel();
  }
});

const soundToggleBtn = document.getElementById('soundToggleBtn');
soundToggleBtn.textContent = soundEnabled ? '🔊' : '🔇';
soundToggleBtn.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  soundToggleBtn.textContent = soundEnabled ? '🔊' : '🔇';
  try { localStorage.setItem(SOUND_PREF_KEY, String(soundEnabled)); } catch (e) { /* ignore */ }
});

document.getElementById('historyToggleBtn').addEventListener('click', () => {
  state.showMoveHistory = !state.showMoveHistory;
  document.getElementById('moveHistoryPanel').style.display = state.showMoveHistory ? 'block' : 'none';
  if (state.showMoveHistory) renderMoveHistory();
});

document.getElementById('warumConfirmBtn').addEventListener('click', () => {
  const move = state._pendingCandidate;
  const swing = state._pendingSwing;
  document.getElementById('warumBar').classList.remove('show');
  if (move) commitMove(move, swing);
});
document.getElementById('warumCancelBtn').addEventListener('click', () => {
  document.getElementById('warumBar').classList.remove('show');
  state._pendingCandidate = null;
  state.selected = null;
  state.legalForSelected = [];
  render();
});

document.getElementById('mistakeTrainerBtn').addEventListener('click', openTrainer);
document.getElementById('trainerCloseBtn').addEventListener('click', closeTrainer);
document.getElementById('trainerNextBtn').addEventListener('click', () => {
  trainerState.index++;
  loadTrainerPuzzle();
});

if (!loadGame()) newGame();
updateMistakeBadge();
